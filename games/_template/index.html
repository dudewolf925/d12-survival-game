<!doctype html><!-- D12_MULTI_GAME_TEMPLATE_V1 --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D12 Challenge</title><meta name="theme-color" content="#000000"><style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#000;color:#fff}*{box-sizing:border-box}body{margin:0}body.popup{overflow:hidden}main{max-width:740px;margin:auto;padding:16px 12px 55px}h1{text-align:center;font-size:clamp(28px,7vw,42px)}.panel{background:#191919;border:1px solid #666;border-radius:16px;padding:16px;margin:16px 0}.hidden{display:none!important}.center{text-align:center}.muted{color:#bbb}input,textarea{width:100%;padding:12px;background:#0b0b0b;color:white;border:1px solid #777;border-radius:10px;font:inherit}button{width:100%;margin:5px 0;padding:14px;border-radius:11px;border:1px solid #999;background:#333;color:#fff;font:700 16px system-ui}button:disabled{opacity:.4}.green{background:#13793b}.red{background:#aa2033}.counter{border:1px solid #a22;border-radius:15px;background:#270c14;padding:18px;text-align:center}.counter strong{font-size:clamp(36px,11vw,56px);display:block;color:#ff7186}.media{display:block;width:100%;max-height:550px;object-fit:contain;border-radius:12px}.embed{width:100%;aspect-ratio:9/16;border:0;border-radius:12px}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gallery>div{flex:0 0 100%;scroll-snap-align:start}.nav{display:flex;gap:10px;align-items:center}.nav button{width:auto;flex:1}.overlay{position:fixed;inset:0;z-index:20;background:#000e;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{background:#1b1b1b;border:2px solid #aaa;border-radius:18px;padding:20px;max-width:500px;width:100%;max-height:95dvh;overflow:auto}.notice{font-size:13px;color:#bbb;white-space:pre-wrap}.clock{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}.slideDescription{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#ff8295;font-size:13px;text-align:center}
</style></head><body><main><h1 id="title">D12 Challenge</h1><p id="subtitle" class="center muted">Roll the D12.</p><section class="panel" id="home"><div id="homeMedia"></div><p id="intro" class="center"></p><div class="counter">😈 SUCCESSFUL HUNTS<strong id="huntCount">…</strong><span class="notice">All-time completed hunts in this game</span></div><label for="name">Your username</label><input id="name" maxlength="32" placeholder="u/YourName"><button id="start" class="green" disabled>Loading…</button></section><section class="panel hidden" id="game"><p id="player" class="center muted"></p><div class="center"><div id="timer" class="clock">00:00:00</div><div class="muted">Survival Time · D12 Roll: <strong id="die">—</strong></div></div><h2 id="slideTitle" class="center"></h2><div id="slideMedia"></div><p id="description" class="slideDescription"></p><p id="hunter" class="center muted"></p><p id="consequenceText" class="center"></p><button id="roll" class="green">🎲 Roll Again</button><button id="accept" class="green hidden">⚡ Show Me My Consequences</button><button id="came" class="red">💦 I Came 💦</button><button id="tap">🏳️ I'm Tapping Out 🏳️</button><p id="lockHint" class="hint"></p><p id="status" class="center" aria-live="polite"></p><button id="retry" class="hidden">Retry Saving Hunt</button></section><p id="configStatus" class="center notice"></p></main><div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle" class="center"></h2><p id="modalMessage" class="center"></p><p id="modalTimer" class="center"></p><textarea id="post" class="hidden" maxlength="10000"></textarea><button id="share" class="hidden">🟠 Share to Reddit</button><button id="closeModal" class="hidden">Close</button></div></div>
<script>
'use strict';const $=id=>document.getElementById(id);const slug=location.pathname.match(/\/games\/([a-z0-9-]+)\//)?.[1]||'';const url=location.href.split('?')[0].split('#')[0];let cfg=null,slides=new Map(),current=null,started=0,elapsed=0,clock=null,ended=false,kind='',rollCount=0,normalUntil=0,swipeUntil=0,swipeTriggered=false,lockTick=null,pending=false,submissionId=null,saved=false;const fmt=ms=>{const t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,'0')).join(':')};const text=(id,v)=>$(id).textContent=String(v??'');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const validUrl=s=>typeof s==='string'&&/^https:\/\//i.test(s);
function mediaNode(value){if(!validUrl(value))return null;let source=value,kind='img';try{const u=new URL(value);if(/(^|\.)redgifs\.com$/.test(u.hostname)&&/^\/(watch|ifr)\/[a-z0-9-]+/i.test(u.pathname)){source='https://www.redgifs.com/ifr/'+u.pathname.split('/')[2];kind='iframe'}else if(/(^|\.)imgur\.com$/.test(u.hostname)&&u.hostname!=='i.imgur.com'){source='https://imgur.com'+u.pathname.replace(/\/$/,'')+'/embed';kind='iframe'}else if(/\.(mp4|webm|mov|gifv)(\?|$)/i.test(value)){source=value.replace(/\.gifv(?=\?|$)/i,'.mp4');kind='video'}}catch{return null}const e=document.createElement(kind);e.src=source;e.className=kind==='iframe'?'embed':'media';if(kind==='img'){e.alt='Slide media';e.loading='lazy'}if(kind==='video'){e.controls=true;e.playsInline=true}if(kind==='iframe'){e.loading='lazy';e.title='Slide media';e.allow='autoplay; fullscreen; picture-in-picture'}return e}
function media(target,items,onSwipe){const host=$(target);host.replaceChildren();items=items.filter(Boolean);if(!items.length)return;if(items.length===1){const n=mediaNode(items[0]);if(n)host.append(n);return}const track=document.createElement('div');track.className='gallery';for(const item of items){const p=document.createElement('div'),n=mediaNode(item);if(n)p.append(n);track.append(p)}host.append(track);const nav=document.createElement('div');nav.className='nav';const prev=document.createElement('button'),next=document.createElement('button'),label=document.createElement('span');prev.textContent='❮';next.textContent='❯';label.textContent='1 / '+items.length;let triggered=false;const go=i=>track.scrollTo({left:track.clientWidth*Math.max(0,Math.min(items.length-1,i)),behavior:'smooth'});prev.onclick=()=>go(Math.round(track.scrollLeft/track.clientWidth)-1);next.onclick=()=>go(Math.round(track.scrollLeft/track.clientWidth)+1);track.onscroll=()=>{if(!track.clientWidth)return;const i=Math.round(track.scrollLeft/track.clientWidth);label.textContent=(i+1)+' / '+items.length;if(i>=1&&!triggered&&onSwipe){triggered=true;onSwipe()}};nav.append(prev,label,next);host.append(nav);const hint=document.createElement('p');hint.className='hint';hint.textContent='Swipe left if you dare 😈';host.append(hint)}
async function rpc(name,body){if(!cfg)throw Error('Configuration unavailable');const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:cfg.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Supabase HTTP '+r.status);return r.json()}
async function count(){try{text('huntCount',Number(await rpc('d12_multi_hunt_count',{p_game_slug:slug})).toLocaleString())}catch{text('huntCount','Unavailable')}}
function tick(){if(started&&!ended){elapsed=Date.now()-started;text('timer',fmt(elapsed))}}function modal(title,message,seconds=0){text('modalTitle',title);text('modalMessage',message);text('modalTimer','');$('post').classList.add('hidden');$('share').classList.add('hidden');$('closeModal').classList.add('hidden');$('modal').classList.remove('hidden');document.body.classList.add('popup');if(seconds){pending=true;const until=Date.now()+seconds*1000;return new Promise(resolve=>{const timer=setInterval(()=>{const left=Math.max(0,Math.ceil((until-Date.now())/1000));text('modalTimer','Continuing in '+left+'s…');if(!left){clearInterval(timer);$('modal').classList.add('hidden');document.body.classList.remove('popup');pending=false;resolve()}},100)})}return Promise.resolve()}
function lockUpdate(){if(ended)return;const remaining=Math.max(0,normalUntil-Date.now(),swipeUntil-Date.now());$('roll').disabled=remaining>0||pending;text('lockHint',remaining?'🔒 Reroll locked — '+Math.ceil(remaining/1000)+'s remaining':'')}
function showSlide(s){if(ended)return;current=s;normalUntil=Date.now()+Number(s.rerollLockSeconds||0)*1000;swipeUntil=0;swipeTriggered=false;text('slideTitle',s.title);text('description',s.description);text('hunter',s.redditUser?'Featured: '+s.redditUser:'');media('slideMedia',[s.url,s.media2],async()=>{if(swipeTriggered||ended||pending)return;swipeTriggered=true;await modal('😈 YOU DARED!',s.swipeMessage||'You were warned…',5);if(current===s&&!ended){swipeUntil=Date.now()+Number(s.swipeLockSeconds||0)*1000;lockUpdate()}});const required=!!s.consequence;$('roll').classList.toggle('hidden',required);$('accept').classList.toggle('hidden',!required);$('accept').disabled=!slides.has(s.destination);text('consequenceText',required?'You must face the consequences to continue.':'');if(s.id===cfg.victorySlide){finish('winner');return}lockUpdate()}
async function roll(){if(ended||pending||$('roll').disabled)return;if(!started){started=Date.now();clock=setInterval(tick,250)}const n=Math.floor(Math.random()*12)+1;text('die',n);rollCount++;const doubled=slides.get(n*2);if(rollCount>=2&&doubled&&Math.random()<.2){await modal('🎲⚡ DOUBLES!',n+' doubled to '+(n*2)+'! Advancing to slide '+doubled.id,5);showSlide(doubled)}else showSlide(slides.get(n))}
function openEnd(){const won=kind==='winner',tapped=kind==='tapped_out';modal(won?'🏆 SURVIVOR!':tapped?'🛡️ TAPPED OUT!':'🎯 HUNT SUCCESSFUL!',`Survival Time: ${fmt(elapsed)}`);$('post').classList.remove('hidden');$('share').classList.remove('hidden');$('closeModal').classList.remove('hidden');$('post').value=(won?'🏆 I survived!':tapped?'🏳️ I tapped out!':'🎯 I was successfully hunted!')+'\n\nSurvival Time: '+fmt(elapsed)+'\n\nPlay: '+url}
function finish(k){if(ended||pending)return;ended=true;kind=k;tick();clearInterval(clock);$('roll').disabled=$('accept').disabled=$('came').disabled=$('tap').disabled=true;openEnd();if(k==='ruined')saveHunt();else text('status',k==='winner'?'🏆 Victory!':'🏳️ Tapped out.')}
async function saveHunt(){if(saved)return;submissionId??=crypto.randomUUID();$('retry').classList.add('hidden');text('status','Saving successful hunt…');try{const total=await rpc('d12_multi_record_hunt',{p_game_slug:slug,p_submission_id:submissionId});saved=true;text('huntCount',Number(total).toLocaleString());text('status','😈 Successful hunt saved!')}catch(e){text('status','Could not save hunt: '+e.message);$('retry').classList.remove('hidden')}}
$('start').onclick=()=>{const name=$('name').value.trim();if(!name)return alert('Enter your username first');$('home').classList.add('hidden');$('game').classList.remove('hidden');text('player','Player: '+name);roll()};$('roll').onclick=roll;$('accept').onclick=()=>{if(current?.consequence&&!pending&&slides.has(current.destination))showSlide(slides.get(current.destination))};$('came').onclick=()=>finish('ruined');$('tap').onclick=()=>finish('tapped_out');$('retry').onclick=saveHunt;$('closeModal').onclick=()=>{$('modal').classList.add('hidden');document.body.classList.remove('popup')};$('share').onclick=()=>{const title=kind==='winner'?'I survived the D12 challenge':kind==='tapped_out'?'I tapped out':'Successfully hunted in D12';location.href='https://www.reddit.com/r/NoNutNovemberChalleng/submit?type=TEXT&title='+encodeURIComponent(title)+'&text='+encodeURIComponent($('post').value)};setInterval(lockUpdate,250);
(async()=>{try{if(!slug)throw Error('Invalid game URL');const r=await fetch('./game-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Game config HTTP '+r.status);cfg=await r.json();if(cfg.slug!==slug)throw Error('Game configuration mismatch');slides=new Map(cfg.slides.map(s=>[s.id,s]));for(let i=1;i<=12;i++)if(!slides.has(i))throw Error('Missing slide '+i);text('title',cfg.title);document.title=cfg.title;text('intro',cfg.introText);media('homeMedia',[cfg.homeImageUrl]);$('start').disabled=false;$('start').textContent='I agree to risk it all';text('configStatus','Game ready · '+slides.size+' slides');count()}catch(e){text('configStatus','Game unavailable: '+e.message);$('start').textContent='Game unavailable'}})();
</script></body></html>
